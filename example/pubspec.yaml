name: tikitaka_example
description: "TikiTaka LFM2.5 실행 예제 앱 — 온디바이스 AI 학습 파트너"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  tikitaka_lfm:
    path: ../
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true

# 앱 아이콘 생성: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  windows:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#26A69A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# 스플래시 화면 생성: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#26A69A"
  image: assets/icon/icon.png
  android_12:
    color: "#26A69A"
    image: assets/icon/icon_foreground.png
  web: false
